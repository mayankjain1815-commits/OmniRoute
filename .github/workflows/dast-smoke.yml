name: DAST smoke (PR)

on:
  pull_request:
    branches: ["main", "release/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-api-key-secret-with-sufficient-length-aaaa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build CLI bundle
        env:
          OMNIROUTE_BUILD_BACKEND_ONLY: "1"
        run: npm run build:cli

      - name: Start OmniRoute
        env:
          PORT: "20128"
          INJECTION_GUARD_MODE: block
        run: |
          nohup node dist/server.js > server.log 2>&1 &
          echo $! > server.pid

          HEALTHY=0
          for i in $(seq 1 30); do
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process exited prematurely!"
              cat server.log
              exit 1
            fi

            if curl -sf http://localhost:20128/api/monitoring/health >/dev/null; then
              echo "Server is up and healthy!"
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "Timed out waiting for server to become healthy."
            cat server.log
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install schemathesis

      - name: Schemathesis smoke (high-risk endpoints, blocking)
        run: |
          schemathesis run docs/openapi.yaml --url http://localhost:20128 \
            --include-path-regex '^/v1/(chat/completions|models)$|^/api/(auth|keys)' \
            --exclude-path-regex '^/api/auth/oidc/' \
            --max-examples 8 --workers 4 --checks all --max-response-time 30 \
            --request-timeout 20 --suppress-health-check all --no-color

      - name: promptfoo injection-guard (blocking)
        env:
          OMNIROUTE_URL: http://localhost:20128
          OMNIROUTE_API_KEY: not-needed-blocked-before-upstream
        run: npx --yes promptfoo@latest eval -c promptfooconfig.yaml --no-cache

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dast-smoke-logs
          path: server.log
          retention-days: 7
